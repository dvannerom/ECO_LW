    - figures/nominal_production/uncertainties/eco_spectral_assessment/eco_goal_residuals_by_abi_scene.png
    - figures/nominal_production/uncertainties/eco_spectral_assessment/eco_adm_narrowband_flux_error.png
    - figures/nominal_production/uncertainties/eco_spectral_assessment/abi_adm_proxy_variability.png
