# Configuration for the ECO_LW Snakemake workflow.
# Paths are relative to the repository root.
days:
  - 245
  - 246
  - 247
  - 249
  - 250
  - 251
  - 252
  - 254
  - 255
  - 256
  - 257
  - 258
  - 259
  - 261
  - 262
  - 263
  - 264
  - 265
  - 266
  - 268
  - 269
  - 270
  - 271
  - 273
  - 274

resolution_km: 2
preprocess_step: 1
lambda_center: -106
raw_abi:
  year: 2024
  primary_root: /ksb-orb/science/goes/ABI/202409
  extra_channels_root: /ksb-orb/science/goes/ABI/202409_missing_channels
  cloud_height_root: /ksb-orb/science/goes/ABI/cloud-top-height/202409
# Shared spectral-only scene taxonomy; K is a reviewed manual choice recorded
# there (see README "Scene taxonomy: choosing K").
scene_taxonomy_file: config/scene_taxonomy.yaml
scene_id_diagnostic_day: 271


# GERB/Clerbaux Sunny spectra support the ECO channel-scenario assessment and
# the separate GOES ABI coefficient fit used only by the proxy production chain.
sunny_dir: data/inputs/sunny
goes_filter_dir: data/inputs/goes_channels
eco_channel_scenarios_file: config/eco_channel_scenarios.yaml
eco_spectral_cv_folds: 5
# Separate ABI-trained spectral classifier for direct per-view Sunny comparison.
# Exploratory only: this sampled classifier is not the reviewed production GMM.
abi_sunny_comparison:
  output_dir: data/nominal_production/diagnostics/abi_sunny/comparison
  figure_dir: figures/nominal_production/diagnostics/abi_sunny/comparison
  components: 7
  points_per_file: 50000
  pixel_step: 10
  chunk_rows: 64
  seed: 42
  gmm_jobs: 1
  max_roundtrip_error_K: 0.1
channel_power_law_file: data/abi_proxy/models/n2b/channel_radiance_power_law.json
narrowband_to_broadband_coeffs_file: data/abi_proxy/models/n2b/narrowband_to_broadband_coeffs.json

# The exploratory comparison uses the common training-day split unless an
# explicit training_files list is supplied.
paths:
  preprocessed: data/preprocessing/abi
  scene_id: data/abi_proxy/products/scene_id
  narrowband: data/abi_proxy/products/narrowband_flux
  broadband: data/abi_proxy/products/broadband_flux

output:
  monthly: data/abi_proxy/products/monthly_flux/monthly_flux_res2km.nc
  eco_spectral_metrics: data/nominal_production/diagnostics/eco_spectral_reconstruction.json
  eco_spectral_residuals: data/nominal_production/diagnostics/eco_spectral_residuals.csv
  eco_n2bc_models: data/nominal_production/models/eco_n2bc_cv_models.joblib
  eco_n2bc_metrics: data/nominal_production/diagnostics/eco_n2bc_stage_metrics.json
  eco_adm_dir: data/nominal_production/products/spectral_assessment/narrowband_flux
  eco_adm_metrics: data/nominal_production/diagnostics/eco_adm_stage_metrics.json
  abi_adm_proxy_summary: data/abi_proxy/diagnostics/adm_proxy_summary.json
  uncertainty_registry: data/nominal_production/reports/uncertainty_registry.json
  uncertainty_gap_report: data/nominal_production/reports/uncertainty_gaps.md
  eco_spectral_figure_dir: figures/nominal_production/uncertainties/eco_spectral_assessment
  eco_spectral_figures:
    - figures/nominal_production/uncertainties/eco_spectral_assessment/eco_spectral_k2_scatter.png
    - figures/nominal_production/uncertainties/eco_spectral_assessment/eco_goal_residuals_by_abi_scene.png
    - figures/nominal_production/uncertainties/eco_spectral_assessment/eco_adm_narrowband_flux_error.png
    - figures/nominal_production/uncertainties/eco_spectral_assessment/abi_adm_proxy_variability.png
