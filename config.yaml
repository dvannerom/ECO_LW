# Configuration for the ECO_LW Snakemake workflow.
# Paths are relative to the repository root.
days:
  - 245
  - 246
  - 247
  - 249
  - 250
  - 251
  - 252
  - 254
  - 255
  - 256
  - 257
  - 258
  - 259
  - 261
  - 262
  - 263
  - 264
  - 265
  - 266
  - 268
  - 269
  - 270
  - 271
  - 273
  - 274

resolution_km: 2
preprocess_step: 1
lambda_center: -106
scene_components: 5
selected_n_components_file: data/models/selected_n_components.json

# Per-file valid-pixel subsampling cap for train_GMM.py (keeps GaussianMixture's
# EM cost bounded regardless of how many training_files/days are merged).
training_points_per_file: 2000000
training_seed: 42
gmm_jobs: 5

# SBDART "Sunny" clear-sky/cloudy scene library used to fit the
# narrowband-to-broadband regression coefficients (see scripts/compute_temperature_SBDART.py).
sunny_dir: data/Sunny
goes_filter_dir: data/goes_channels
channel_power_law_file: data/models/channel_radiance_power_law.json
narrowband_to_broadband_coeffs_file: data/models/narrowband_to_broadband_coeffs.json

# Selected files used to train the scene classifier. Add more representative days as needed.
training_files:
  - data/preprocessed_files/abi_245_res2km_step1.nc
  - data/preprocessed_files/abi_247_res2km_step1.nc
  - data/preprocessed_files/abi_249_res2km_step1.nc
  - data/preprocessed_files/abi_250_res2km_step1.nc
  - data/preprocessed_files/abi_251_res2km_step1.nc
  - data/preprocessed_files/abi_254_res2km_step1.nc
  - data/preprocessed_files/abi_255_res2km_step1.nc
  - data/preprocessed_files/abi_256_res2km_step1.nc
  - data/preprocessed_files/abi_257_res2km_step1.nc
  - data/preprocessed_files/abi_258_res2km_step1.nc
  - data/preprocessed_files/abi_261_res2km_step1.nc
  - data/preprocessed_files/abi_262_res2km_step1.nc
  - data/preprocessed_files/abi_263_res2km_step1.nc
  - data/preprocessed_files/abi_264_res2km_step1.nc
  - data/preprocessed_files/abi_266_res2km_step1.nc
  - data/preprocessed_files/abi_268_res2km_step1.nc
  - data/preprocessed_files/abi_269_res2km_step1.nc
  - data/preprocessed_files/abi_270_res2km_step1.nc
  - data/preprocessed_files/abi_273_res2km_step1.nc
  - data/preprocessed_files/abi_274_res2km_step1.nc

model: data/models/gmm_pipeline_merged_1files_res2km_5comp.joblib
output:
  root: data
  monthly: data/monthly/monthly_flux_res2km.nc
