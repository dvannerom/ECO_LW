schema_version: 1
wavelength_units: um

# The RfMA specifies passbands, not measured flight SRFs. Smooth edges here
# are an explicit idealized approximation, not an ECO instrument characterization.
default_edge_slope_per_um: 10.0

retrieval_geometry:
  source: "Sunny GERB/Clerbaux directional radiance columns"
  available_view_angles_deg: [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55, 60, 65, 70, 75, 80, 85]
  retrieval_view_angles_deg: [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55, 60, 65, 70]
  retrieval_note: "Idealized 15-view, noise-free case using all Sunny views within the RfMA VZA<=70 degree retrieval domain; this is not the mission's full N=1..20 geometry distribution."

scenarios:
  rfma_goal_6:
    source: "RfMA Table 4.1, p.43; goal passband limits"
    response_model: smooth_bands
    channel_names: [water_vapour, cloud_phase, ozone, cloud_temperature, cloud_optical_depth, carbon_dioxide]
    channel_bands_um: [[5.0, 8.0], [8.0, 9.1], [9.1, 10.3], [10.3, 11.4], [11.4, 12.5], [12.5, 16.0]]
    description: "RfMA six-channel goal passbands with idealized sigmoid edges."

  rfma_threshold_6:
    source: "RfMA Table 4.1, p.43; threshold passband limits"
    response_model: smooth_bands
    channel_names: [water_vapour, cloud_phase, ozone, cloud_temperature, cloud_optical_depth, carbon_dioxide]
    channel_bands_um: [[6.0, 8.0], [8.0, 9.1], [9.1, 10.3], [10.3, 11.4], [11.4, 12.5], [12.5, 14.0]]
    description: "RfMA six-channel threshold passbands with idealized sigmoid edges."

  supplied_square_6_14:
    source: "lw_spectral_responses_tmp.py, six separate 6-14 um bands"
    response_model: smooth_bands
    channel_names: [band_1, band_2, band_3, band_4, band_5, band_6]
    channel_bands_um: [[6.0, 8.0], [8.0, 9.1], [9.1, 10.3], [10.3, 11.4], [11.4, 12.5], [12.5, 14.0]]
    description: "Six smooth-edged bands, no fmb envelope."

  supplied_sloped_6_14:
    source: "lw_spectral_responses_tmp.py, six 6-14 um bands with fmb envelope"
    response_model: smooth_bands
    channel_names: [band_1, band_2, band_3, band_4, band_5, band_6]
    channel_bands_um: [[6.0, 8.0], [8.0, 9.1], [9.1, 10.3], [10.3, 11.4], [11.4, 12.5], [12.5, 14.0]]
    envelope_band_um: [7.0, 13.0]
    envelope_edge_slope_per_um: 1.0
    description: "Six smooth-edged bands multiplied by the supplied fmb envelope."

  supplied_tails_6_14:
    source: "lw_spectral_responses_tmp.py, six channels with tails"
    response_model: smooth_bands
    channel_names: [band_1, band_2, band_3, band_4, band_5, band_6]
    channel_bands_um: [[null, 8.0], [8.0, 9.1], [9.1, 10.3], [10.3, 11.4], [11.4, 12.5], [12.5, null]]
    envelope_band_um: [7.0, 13.0]
    envelope_edge_slope_per_um: 1.0
    description: "Outer channels extend as tails, bounded by the supplied fmb envelope."

  supplied_extended_4p5_18:
    source: "lw_spectral_responses_tmp.py, extended 4.5-18 um candidate"
    response_model: smooth_bands
    channel_names: [band_1, band_2, band_3, band_4, band_5, band_6]
    channel_bands_um: [[4.5, 8.0], [8.0, 9.1], [9.1, 10.3], [10.3, 11.4], [11.4, 12.5], [12.5, 18.0]]
    description: "Six smooth-edged bands spanning 4.5-18 um."
