scope: >-
  Fast sampled smoke test, not a scientific production budget: four cached
  tiles/day on two held-in and two held-out days, 5000-row reservoirs,
  six components and one seed, two noise realizations and identity/10 km
  spatial checks. Full Sunny library retained for grouped-fold coverage.
  Existing convergence caches are reused or generated by their own rules.
  ABI-to-ECO assignment/spatial transfer and spatial independence assumed.
