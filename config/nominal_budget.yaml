scope: >-
  Instantaneous spectral-only simulation on sampled eligible ABI overlap
  population and grouped held-out Sunny columns. ABI 2-to-10 km box-footprint
  processing differences are included assuming transfer and independence
  from the other source errors. Scene-library original modified-log ADM.
  ABI SRFs define taxonomy; ECO goal SRFs define physical flux retrieval.
  Assignment transitions are measured on held-out ABI pixels with added NEdT
  and a fixed GMM, then propagated through Sunny scene ADMs and included under
  the explicit assumption of similar ECO response. Conditional scene-level
  transitions are independent of simulated ECO radiometric noise.
