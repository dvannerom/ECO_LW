schema_version: 1
source:
  document: "ESA Report for Mission Assessment: Earth Explorer 12 Candidate Mission ECO"
  reference: "ESA-EOPSM-ECO-RP-5024, Issue 1.0, 2026-06-12"
  doi: "10.5281/zenodo.20543209"
  conventions:
    goal_threshold: "Goal is highest achievable benefit; threshold is minimum major step change."
    confidence: "Retain the confidence level exactly as stated by each requirement; null means not specified in the cited passage."
    allocation: "No MO2 per-source allocation is approved here. Do not infer allocations from top-level requirements."

scope:
  evaluation_target: ECO
  mission_objective: MO2
  product: outgoing_longwave_radiation
  units: "W m-2"
  requirements_file: docs/mission_context.md
  budget_status: "unallocated"
  evidence_sources:
    eco_mission_definition:
      role: "Target requirements, channel scenarios, instrument performance, and geometry."
    abi_goes16_goes18:
      role: "Empirical proxy for scene, spatial, temporal, and transferable algorithm behavior."
      transferability: "Term-specific; record geometry/channel mismatches and do not treat ABI performance as ECO performance."
    gerb_clerbaux_sbdart:
      role: "Spectral simulation evidence; convolve spectra with ECO response functions for ECO retrieval estimates."
      local_path: data/Sunny
    ceres:
      role: "Independent broadband/ADM validation where product, footprint, and sampling support the comparison."
  channel_scenarios:
    selection_policy: "Evaluate each configured ECO channel scenario; GOES channels remain proxy inputs and are not mutually exclusive with ECO scenarios."

requirements:
  broadband_olr_definition:
    rfmA_id: ObsReq_8
    source: "RfMA §4.2.2, p.36"
    quantity: broadband_spectral_interval
    aggregation: "monthly_goal_to_seasonal_threshold_flux_maps"
    units: um
    wavelength_range: [4.0, 100.0]
    note: "The Sunny study integration over 2.5-500 um is a separate reference convention and must not be silently substituted."

  average_olr_accuracy:
    rfmA_id: ObsReq_10
    source: "RfMA §4.2.2, p.37"
    quantity: accuracy
    aggregation: "monthly_goal_to_seasonal_threshold_flux_maps"
    units: percent
    goal: 0.3
    threshold: 1.25
    reference_flux_w_m2: 240.0
    reported_absolute_equivalent_w_m2:
      goal: 0.5
      threshold: 2.0
    confidence_level: null
    note: >-
      Preserve both the percentages and the absolute equivalents as reported.
      The RfMA describes equal quadratic contributions from RSR and OLR; confirm
      the exact conversion and confidence convention before using derived values
      for compliance.

  average_olr_stability:
    rfmA_id: ObsReq_11
    source: "RfMA §4.2.2, p.37"
    quantity: stability
    aggregation: "monthly_to_seasonal_flux_maps"
    units: percent
    maximum: 0.3
    confidence_level: null

  instantaneous_olr_accuracy:
    rfmA_id: ObsReq_15
    source: "RfMA §4.2.2, p.39"
    quantity: accuracy
    aggregation: "instantaneous_flux_map"
    spatial_resolution_km:
      goal: 10
      threshold: 50
    units: percent
    goal: 1.42
    threshold: 5.83
    reference_flux_w_m2: 240.0
    reported_absolute_equivalent_w_m2:
      goal: 2.4
      threshold: 9.9
    confidence_level: null
    note: >-
      Preserve percentages and RfMA-reported absolute equivalents. Confirm the
      RSR/OLR equal-contribution conversion and confidence convention before
      deriving a compliance threshold.

  narrowband_to_broadband_olr_accuracy:
    rfmA_id: ObsReq_16
    source: "RfMA §4.2.2, p.39"
    quantity: reconstruction_accuracy
    aggregation: "instantaneous_olr_spectral_reconstruction"
    units: percent
    maximum: 0.84
    confidence_level: null
    note: >-
      This is a spectral-reconstruction sub-budget, not the complete OLR error
      requirement. Do not divide by sqrt(2) or otherwise apportion without an
      explicit RfMA convention or approved project allocation.

  regional_annual_tor_sampling:
    rfmA_id: ObsReq_7
    source: "RfMA §4.2.1, p.35"
    quantity: sampling_error
    aggregation: "annual_regional_tor"
    region_definition: "5 degree by 5 degree areas, continental or hemispheric asymmetry"
    units: "W m-2"
    maximum: 4.0
    confidence_level: null
    note: "TOR is total outgoing radiation; this repository's OLR-only chain does not cover the full requirement."

  average_olr_spatial_resolution:
    rfmA_id: ObsReq_9
    source: "RfMA §4.2.2, p.36"
    quantity: spatial_resolution
    aggregation: "monthly_goal_to_seasonal_threshold_flux_maps"
    units: km
    goal: 10
    threshold: 50

  tir_camera_spatial_resolution:
    rfmA_id: MeasReq_10
    source: "RfMA §4.3.3, p.43"
    quantity: spatial_resolution
    aggregation: "camera_measurement"
    units: km
    goal: 2
    threshold: 10

  tir_radiometric_sensitivity:
    rfmA_id: MeasReq_8
    source: "RfMA Table 4.1, p.43"
    quantity: noise_equivalent_differential_temperature
    reference_temperature_k: 255
    units: K
    channels:
      water_vapour:
        wavelength_um: [5, 8]
        goal: 0.4
        threshold: 0.7
      cloud_phase:
        wavelength_um: [8, 9.1]
        goal: 0.4
        threshold: 0.4
      ozone:
        wavelength_um: [9.1, 10.3]
        goal: 0.4
        threshold: 0.4
      cloud_temperature:
        wavelength_um: [10.3, 11.4]
        goal: 0.4
        threshold: 0.4
      cloud_optical_depth:
        wavelength_um: [11.4, 12.5]
        goal: 0.4
        threshold: 0.4
      carbon_dioxide:
        wavelength_um_goal: [12.5, 16]
        wavelength_um_threshold: [12.5, 14]
        goal: 0.4
        threshold: 0.6
    note: "Sensitivity values are NEdT at the reference temperature, not absolute radiometric accuracy."

  camera_absolute_radiometric_accuracy:
    rfmA_id: MeasReq_9
    source: "RfMA §4.3.3, p.43"
    quantity: absolute_radiometric_accuracy
    aggregation: "camera_radiance_measurement"
    units: percent
    maximum: 10.0
    confidence_level: 2
    note: "The RfMA expects integral cross-calibration against the WFOV radiometer to improve higher-level products; this is not a pixel-level camera calibration."

  multiangle_temporal_coincidence:
    rfmA_id: ObsReq_12
    source: "RfMA §4.2.2, p.38"
    quantity: temporal_coincidence
    aggregation: "views_used_in_one_flux_retrieval"
    criterion: "Views sufficiently close in time to be statistically simultaneous relative to scene dynamics."

  scene_identification_and_coregistration:
    rfmA_id: ObsReq_17
    source: "RfMA §4.2.2, p.40"
    quantity: scene_identification_and_coregistration
    aggregation: "instantaneous_multiangular_flux_retrieval"
    criterion: "Spectral and spatial information supports scene identification and co-registration of multi-angular views."

  imagery_radiometer_cross_calibration:
    rfmA_id: ObsReq_14
    source: "RfMA §4.2.2, p.38; §6.6, p.71"
    quantity: integral_cross_calibration
    aggregation: "radiometer_wfov_integral"
    criterion: "Camera-derived radiances integrated over the WFOV are compared with the Earth radiometer measurement."
    limitation: "Not a pixel-level calibration; scene-dependent errors may remain despite disk-integral agreement."

  tor_radiometer_accuracy:
    rfmA_id: MeasReq_6
    source: "RfMA §4.3.2, p.42"
    quantity: absolute_uncertainty
    aggregation: "level_1_earth_wfov_measurement"
    units: "W m-2"
    maximum: 1.0
    confidence_level: 2
    predicted_performance_w_m2: 0.37

  tor_radiometer_stability:
    rfmA_id: MeasReq_7
    source: "RfMA §4.3.2, p.42; Table 7.7, p.90"
    quantity: long_term_stability
    aggregation: "nominal_mission_lifetime"
    units: "W m-2"
    goal: 0.05
    threshold: 0.1
    predicted_performance_w_m2: 0.04

  multispectral_cadence:
    rfmA_id: MeasReq_3
    source: "RfMA §4.3.1, p.41"
    quantity: sampling_cadence
    aggregation: "camera_measurements"
    units: seconds
    maximum_interval: 30

phase_0_evidence:
  lw_narrowband_to_broadband_fit_noise:
    source: "RfMA §6.2.2, p.62"
    quantity: k2_fit_noise
    units: percent
    value: 1.5
    channel_basis: "Nominal ECO LW channels; >2300 LW scenes; no scene stratification."
    comparison_requirement: ObsReq_16
    note: "Evidence/result, not itself a requirement or a per-source allocation."

uncertainty_components:
  sunny_n2bc_spectral_only:
    quantity: "Held-out narrowband-to-broadband OLR relative residual from true integrated ECO band fluxes"
    units: percent
    statistic: "Signed mean bias, sample standard deviation, RMSE; report clear/cloud regimes separately"
    requirement_ids: [ObsReq_16]
    source: "GERB/Clerbaux Sunny hemispheric spectral flux; ECO scenario SRFs"
    derivation: "Grouped five-fold validation; shared clear/cloud scene indices remain in one fold"
    domain: "Conditional on Sunny simulation library, modeled SRFs, 2.5-500 um reference integration, and regression family"
    aggregation_scale: "Instantaneous simulated scene; not spatially or temporally aggregated"
    correlation_behavior: "Do not combine with other terms without matched residual covariance."
    evidence_status: "Conditional simulation evidence; not compliance."

  sunny_angular_plus_spectral:
    quantity: "Held-out broadband OLR relative residual after ADM-retrieved band fluxes and fold-specific N2BC"
    units: percent
    statistic: "Paired spectral-only and end-to-end residuals; signed bias, sample spread, and covariance decomposition"
    requirement_ids: [ObsReq_15]
    source: "GERB/Clerbaux Sunny directional radiances and hemispheric flux; ECO scenario SRFs"
    derivation: "Apply models trained on true band fluxes to held-out ADM-retrieved band fluxes; pair by shared scene index"
    domain: "Idealized 15-view, noise-free, 0-70 degree Sunny retrieval; not representative N=1..20 mission geometry"
    aggregation_scale: "Instantaneous simulated scene; not spatially or temporally aggregated"
    correlation_behavior: "Retain observed covariance between spectral-only residual and angular-plus-interaction increment."
    evidence_status: "Conditional simulation evidence; not compliance."

  sunny_adm_narrowband_diagnostic:
    quantity: "ADM-retrieved ECO band-flux error relative to true simulated hemispheric band flux"
    units: percent
    statistic: "Signed mean bias, sample standard deviation, and RMSE by channel and clear/cloud regime"
    requirement_ids: [ObsReq_12, ObsReq_15]
    source: "GERB/Clerbaux Sunny directional radiance and hemispheric flux; ECO scenario SRFs"
    derivation: "Per-scene/channel ADM retrieval compared with integrated true band flux"
    domain: "Idealized 15-view, noise-free simulation; not representative of the mission's full geometry/noise population"
    aggregation_scale: "Instantaneous simulated scene/channel"
    correlation_behavior: "Channel covariance is unavailable; do not combine channels independently."
    evidence_status: "Conditional angular-stage simulation diagnostic; not the complete broadband ObsReq 15 metric."

  abi_adm_proxy_between_day:
    quantity: "Between-day spread of fitted ABI ADM parameters and normalized angular profiles"
    units: "dimensionless parameter; relative profile spread in percent"
    statistic: "Sample standard deviation across daily scene-average ADM fits"
    requirement_ids: [ObsReq_12, ObsReq_15, ObsReq_17]
    source: "GOES-16/18 ABI fitted ADM products"
    derivation: "Stratify fitted scene/channel ADM summaries by day; no per-pixel fit covariance is retained"
    domain: "ABI channel responses, two fixed views, configured proxy scene classes"
    aggregation_scale: "Between-day scene-average proxy summary"
    correlation_behavior: "Keep separate from Sunny/ECO-channel terms unless scene, channel, geometry, and covariance transfer is justified."
    evidence_status: "Empirical proxy evidence; not a direct ECO flux uncertainty."

unquantified_terms:
  radiance_noise_and_calibration:
    stage: Radiances
    quantity: "ECO channel radiometric noise and calibration uncertainty"
    units: "K and radiance units; output flux impact not estimated"
    requirement_ids: [MeasReq_8, MeasReq_9, ObsReq_15]
    source: "RfMA Table 4.1, p.43; RfMA §4.3.3, p.43"
    next_input: "Per-channel noise covariance, absolute calibration covariance, and their spectral/scene dependence."
  scene_id_cth_parallax_coregistration:
    stage: "Scene identification / co-registration"
    quantity: "Scene classification, cloud-top-height/parallax, and inter-view registration error"
    units: null
    requirement_ids: [ObsReq_17, ObsReq_15]
    source: "RfMA §4.2.2, p.40"
    next_input: "Representative truth labels, CTH error distributions, view geometry, and flux impact from wrong-scene/wrong-pixel assignment."
  adm_population_and_model_form:
    stage: "ADM angular conversion"
    quantity: "ECO ADM population, model-form, and view-geometry uncertainty"
    units: percent
    requirement_ids: [ObsReq_12, ObsReq_15, ObsReq_17]
    source: "RfMA §4.2.2, pp.38,40"
    next_input: "Representative N=1..20 angular/noise cases, scene population, within-scene pixel spread, fallback behavior, and model-form comparison."
  temporal_coincidence:
    stage: "Scene identification / co-registration"
    quantity: "Flux error from non-simultaneous multi-angle observations and scene evolution"
    units: null
    requirement_ids: [ObsReq_12, MeasReq_3]
    source: "RfMA §4.2.2, p.38; RfMA §4.3.1, p.41"
    next_input: "Time-tagged multi-view sequence and scene-dependent temporal decorrelation model."
  narrowband_srf_and_reference_domain:
    stage: "N2BC application"
    quantity: "N2BC coefficient, assumed SRF, and 2.5-500 um versus 4-100 um reference-domain uncertainty"
    units: percent
    requirement_ids: [ObsReq_8, ObsReq_16]
    source: "RfMA §4.2.2, pp.36,39; RfMA §6.2.1"
    next_input: "Measured/validated flight SRFs, consistent 4-100 um reference integration, and independent spectral validation."
  broadband_wfov_anchoring:
    stage: "Broadband flux"
    quantity: "Scene-dependent camera-to-WFOV integral cross-calibration residual"
    units: null
    requirement_ids: [ObsReq_14, MeasReq_9]
    source: "RfMA §4.2.2, p.38; RfMA §6.6, p.71; RfMA §4.3.3, p.43"
    next_input: "WFOV/camera matchup residuals and their scene/geometry-dependent covariance."
  channel_and_shared_source_covariance:
    stage: "Narrowband fluxes / N2BC application"
    quantity: "Cross-channel and shared radiance/ADM/N2BC source covariance"
    units: "percent squared"
    requirement_ids: [ObsReq_10, ObsReq_15, ObsReq_16, MeasReq_8]
    source: "RfMA §4.2.2, pp.37,39; RfMA Table 4.1, p.43"
    next_input: "Matched per-scene channel residual vectors and instrument/algorithm covariance across shared sources."
  aggregation_sampling_covariance:
    stage: Aggregation
    quantity: "Spatial/temporal sampling, representativeness, and correlated-error effect on monthly/seasonal OLR"
    units: percent and W m-2
    requirement_ids: [ObsReq_8, ObsReq_9, ObsReq_10, ObsReq_11]
    source: "RfMA §4.2.2, pp.36-37"
    next_input: "Mission sampling simulation, aggregation masks/weights, and spatial/temporal covariance; do not assume 1/sqrt(N)."
  olr_stability:
    stage: Aggregation
    quantity: "Long-term OLR product stability"
    units: percent
    requirement_ids: [ObsReq_11, MeasReq_7]
    source: "RfMA §4.2.2, p.37; RfMA §4.3.2, p.42"
    next_input: "Instrument drift, calibration transfer, and time-series stability characterization."
  independent_validation:
    stage: "Broadband flux / aggregation"
    quantity: "Independent absolute validation of instantaneous and aggregated broadband OLR"
    units: percent and W m-2
    requirement_ids: [ObsReq_10, ObsReq_15]
    source: "RfMA §4.2.2, pp.37,39"
    next_input: "CERES or other suitable independent matchup data with footprint, time, and angular sampling treatment."

evidence_mappings:
  abi_adm_proxy_variability:
    source: "GOES-16/GOES-18 ABI ADM products produced by fit_ADM.py"
    statistic: "Between-day spread of fitted shape parameter and normalized angular profile, stratified by ABI channel and proxy scene"
    uncertainty_role: "Empirical proxy evidence for real-scene, geographic, and temporal ADM variability; not curve_fit covariance and not an ECO sigma without transfer validation."
    rfmA_requirements:
      ObsReq_15: "Informs the angular-conversion portion of instantaneous OLR accuracy by proxy comparison only."
      ObsReq_17: "Informs scene-conditioned ADM behavior; does not estimate ECO classification or co-registration error."
      ObsReq_12: "Does not directly demonstrate ECO's dense quasi-simultaneous multi-angle sampling."
    transfer_limits:
      - "ABI and ECO channel responses differ."
      - "ABI has two fixed geographic views; ECO uses N=1..20 quasi-simultaneous views."
      - "Proxy scene classes are not proven equivalent to ECO scene classes."
    combination_policy: "Keep separate from Sunny/ECO estimates until channel, scene, geometry, and covariance transfer are established."

  sunny_eco_adm_retrieval:
    source: "GERB/Clerbaux Sunny directional radiance spectra convolved with ECO channel scenarios"
    statistic: "Per-scene/channel ADM fit residual and ADM-retrieved band-flux error"
    uncertainty_role: "ECO-specific simulated angular-retrieval evidence under configured geometry; supports end-to-end ObsReq_15 evaluation."
    rfmA_requirements:
      ObsReq_12: "Geometry scenario is explicitly stated; current 15-view test does not represent the full N=1..20 distribution."
      ObsReq_15: "Contributes simulated angular-retrieval error to instantaneous OLR accuracy."
      ObsReq_17: "Does not estimate scene misclassification or image co-registration error."
    combination_policy: "Combine with N2BC only by applying N2BC models to ADM-retrieved fluxes in held-out scenes; retain the N2BC-only and end-to-end scores separately."

allocation_policy:
  status: "not_yet_allocated"
  note: >-
    Register named uncertainty components with source, correlation/averaging
    behavior, and requirement IDs as evidence becomes available. A compliance
    report must compare like-for-like quantities at the requirement's
    aggregation scale. Do not claim compliance by summing components with
    unverified independence or by inventing an allocation.
