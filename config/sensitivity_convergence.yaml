schema_version: 1
base_settings: config/sensitivity_run.yaml
output_dir: data/uncertainty_runs/convergence
figure_dir: figures/uncertainty/convergence
training_days: [245, 247, 254, 261]
evaluation_days: [246, 252, 259, 271]
tile_counts: [12, 48, 192]
sampling_seeds: [42, 73, 109]
initialization_seeds: [42, 73, 109]
training_sampling_seed: 42
fixed_gmm_points: 20000
gmm_point_counts: [20000, 50000, 100000]
adm_training_points: 100000
gmm_initializations: 2
max_candidate_tiles: 6000
bootstrap_replicates: 500
confidence_level: 0.95
stability_relative_tolerance: 0.10
stability_absolute_tolerance_w_m2: 0.10
minimum_regime_footprints: 100
scope: >-
  ABI proxy temporal holdout, eligibility-screened non-overlapping equal-area
  tiles. Nested evaluation tiles with fixed models isolate evaluation sampling;
  training tile coverage, GMM point count and initialization vary separately
  on the same evaluation cases. Four held-out days support only exploratory
  day/tile bootstrap intervals, not climatological confidence.
